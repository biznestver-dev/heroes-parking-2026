        // State variables
        let vehicles = [];
        let activeTab = 'pending'; // 'pending' or 'arrived'
        let viewMode = 'cards'; // 'cards' or 'table'
        let searchQuery = '';
        let selectedCategory = 'all';

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initData();
            setupEventListeners();
            populateCategoryFilter();
            render();
        });

        function initData() {
            const saved = localStorage.getItem('heroes_sport_vehicles_2026');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Map with original + arrived status
                    vehicles = rawVehicleData.map((item, index) => {
                        const found = parsed.find(p => p.id === index);
                        return {
                            id: index,
                            ...item,
                            arrived: found ? found.arrived : false,
                            arrivedAt: found ? found.arrivedAt : null
                        };
                    });
                } catch (e) {
                    console.error("Error loading localStorage", e);
                    loadDefaultVehicles();
                }
            } else {
                loadDefaultVehicles();
            }
        }

        function loadDefaultVehicles() {
            vehicles = rawVehicleData.map((item, index) => ({
                id: index,
                ...item,
                arrived: false,
                arrivedAt: null
            }));
            saveToStorage();
        }

        function saveToStorage() {
            const stateToSave = vehicles.map(v => ({ id: v.id, arrived: v.arrived, arrivedAt: v.arrivedAt }));
            localStorage.setItem('heroes_sport_vehicles_2026', JSON.stringify(stateToSave));
        }

        function setupEventListeners() {
            // Search input
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearch');
            
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                clearSearchBtn.classList.toggle('hidden', searchQuery === '');
                render();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.classList.add('hidden');
                render();
            });

            // Category filter
            document.getElementById('categoryFilter').addEventListener('change', (e) => {
                selectedCategory = e.target.value;
                render();
            });

            // Tabs
            document.getElementById('tabPendingBtn').addEventListener('click', () => {
                activeTab = 'pending';
                updateTabStyles();
                render();
            });

            document.getElementById('tabArrivedBtn').addEventListener('click', () => {
                activeTab = 'arrived';
                updateTabStyles();
                render();
            });

            // View toggle
            document.getElementById('toggleViewBtn').addEventListener('click', () => {
                viewMode = viewMode === 'cards' ? 'table' : 'cards';
                document.getElementById('viewBtnText').textContent = viewMode === 'cards' ? 'Таблица' : 'Карточки';
                document.querySelector('#toggleViewBtn i').className = viewMode === 'cards' ? 'fa-solid fa-table-cells' : 'fa-solid fa-list';
                render();
            });

            // Reset storage
            document.getElementById('resetStorageBtn').addEventListener('click', () => {
                showModal(
                    'Сброс данных',
                    'Вы действительно хотите сбросить все отметки о прибытии автомобилей?',
                    () => {
                        loadDefaultVehicles();
                        render();
                        showToast('Все отметки сброшены');
                    },
                    true
                );
            });

            // Modal OK button
            document.getElementById('modalOkBtn').addEventListener('click', () => {
                closeModal();
                if (modalCallback) modalCallback();
            });

            document.getElementById('modalCancelBtn').addEventListener('click', () => {
                closeModal();
            });
        }

        function updateTabStyles() {
            const pendingBtn = document.getElementById('tabPendingBtn');
            const arrivedBtn = document.getElementById('tabArrivedBtn');

            if (activeTab === 'pending') {
                pendingBtn.className = "pb-3 border-b-2 border-indigo-500 text-indigo-400 flex items-center gap-2 transition-colors";
                arrivedBtn.className = "pb-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition-colors";
            } else {
                arrivedBtn.className = "pb-3 border-b-2 border-emerald-500 text-emerald-400 flex items-center gap-2 transition-colors";
                pendingBtn.className = "pb-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition-colors";
            }
        }

        function populateCategoryFilter() {
            const categories = [...new Set(rawVehicleData.map(v => v.category))].sort();
            const select = document.getElementById('categoryFilter');
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function render() {
            // Update stats
            const totalCount = vehicles.length;
            const arrivedCount = vehicles.filter(v => v.arrived).length;
            const pendingCount = totalCount - arrivedCount;

            document.getElementById('statTotal').textContent = totalCount;
            document.getElementById('statArrived').textContent = arrivedCount;
            document.getElementById('statPending').textContent = pendingCount;
            document.getElementById('badgePending').textContent = pendingCount;
            document.getElementById('badgeArrived').textContent = arrivedCount;

            // Filter vehicles
            const filtered = vehicles.filter(v => {
                const matchesTab = activeTab === 'pending' ? !v.arrived : v.arrived;
                const matchesCategory = selectedCategory === 'all' || v.category === selectedCategory;
                const matchesSearch = searchQuery === '' || 
                    v.plate.toLowerCase().includes(searchQuery) ||
                    v.brand.toLowerCase().includes(searchQuery) ||
                    v.category.toLowerCase().includes(searchQuery) ||
                    v.note.toLowerCase().includes(searchQuery);
                
                return matchesTab && matchesCategory && matchesSearch;
            });

            const container = document.getElementById('vehiclesContainer');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-10 text-center space-y-3 mt-4">
                        <div class="text-4xl text-slate-600">
                            <i class="fa-solid fa-car-tunnel"></i>
                        </div>
                        <h3 class="text-slate-300 font-bold text-base">Автомобили не найдены</h3>
                        <p class="text-xs text-slate-500 max-w-sm mx-auto">
                            ${searchQuery || selectedCategory !== 'all' ? 'Попробуйте изменить параметры поиска или фильтрации.' : 'В этом списке пока нет автомобилей.'}
                        </p>
                    </div>
                `;
                return;
            }

            if (viewMode === 'cards') {
                renderCards(filtered, container);
            } else {
                renderTable(filtered, container);
            }
        }

        function renderCards(items, container) {
            let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">';
            
            items.forEach(v => {
                const isVip = v.note.includes('VIP') || v.category.includes('VIP');
                const badgeClass = isVip ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30';
                
                html += `
                    <div class="bg-slate-800 border ${v.arrived ? 'border-emerald-600/40 bg-slate-800/90' : 'border-slate-700'} rounded-2xl p-4 shadow-md flex flex-col justify-between transition-all hover:border-slate-600">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <span class="text-[11px] font-semibold px-2.5 py-1 rounded-lg border ${badgeClass} uppercase tracking-wide truncate max-w-[200px]">
                                    ${escapeHtml(v.category)}
                                </span>
                                <span class="text-xs font-mono text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded border border-slate-700/50">
                                    #${v.id + 1}
                                </span>
                            </div>
                            
                            <div class="my-2">
                                <div class="text-lg font-bold text-slate-100 tracking-wide font-mono bg-slate-900/90 px-3 py-1.5 rounded-xl border border-slate-700 text-center shadow-inner">
                                    ${escapeHtml(v.plate)}
                                </div>
                            </div>

                            <div class="flex items-center justify-between text-sm text-slate-300 mt-2 px-1">
                                <span class="font-medium flex items-center gap-1.5"><i class="fa-solid fa-car text-slate-400"></i> ${escapeHtml(v.brand)}</span>
                                ${v.note ? `<span class="text-xs text-amber-400/90 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20">${escapeHtml(v.note)}</span>` : ''}
                            </div>
                            ${v.arrived && v.arrivedAt ? `<div class="text-[11px] text-emerald-400 mt-2 px-1"><i class="fa-solid fa-check mr-1"></i>Прибыл: ${v.arrivedAt}</div>` : ''}
                        </div>

                        <div class="mt-4 pt-3 border-t border-slate-700/60 flex items-center justify-between">
                            <span class="text-xs ${v.arrived ? 'text-emerald-400 font-medium' : 'text-slate-400'}">
                                ${v.arrived ? '<i class="fa-solid fa-circle-check mr-1"></i>На площадке' : 'Ожидается'}
                            </span>
                            <button onclick="toggleArrival(${v.id})" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 ${v.arrived ? 'bg-slate-700 hover:bg-slate-600 text-slate-200' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}">
                                ${v.arrived ? '<i class="fa-solid fa-rotate-left"></i> Вернуть' : '<i class="fa-solid fa-check"></i> Приехал'}
                            </button>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function renderTable(items, container) {
            let html = `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-900/80 border-b border-slate-700 text-slate-400 text-xs uppercase tracking-wider">
                                    <th class="py-3 px-4">№</th>
                                    <th class="py-3 px-4">Категория / Лицо</th>
                                    <th class="py-3 px-4">Марка авто</th>
                                    <th class="py-3 px-4">Гос. номер</th>
                                    <th class="py-3 px-4">Примечание</th>
                                    <th class="py-3 px-4 text-center">Статус</th>
                                    <th class="py-3 px-4 text-right">Действие</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700/60 text-slate-200">
            `;

            items.forEach((v, index) => {
                html += `
                    <tr class="hover:bg-slate-750 transition-colors">
                        <td class="py-3 px-4 text-slate-500 font-mono text-xs">${index + 1}</td>
                        <td class="py-3 px-4 font-medium">${escapeHtml(v.category)}</td>
                        <td class="py-3 px-4 text-slate-300">${escapeHtml(v.brand)}</td>
                        <td class="py-3 px-4 font-mono font-bold tracking-wide">${escapeHtml(v.plate)}</td>
                        <td class="py-3 px-4 text-xs text-amber-400">${escapeHtml(v.note)}</td>
                        <td class="py-3 px-4 text-center">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${v.arrived ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-slate-700 text-slate-400'}">
                                ${v.arrived ? 'Прибыл' : 'Ожидание'}
                            </span>
                        </td>
                        <td class="py-3 px-4 text-right">
                            <button onclick="toggleArrival(${v.id})" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all shadow-sm ${v.arrived ? 'bg-slate-700 hover:bg-slate-600 text-slate-200' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}">
                                ${v.arrived ? 'Вернуть' : 'Приехал'}
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function toggleArrival(id) {
            const v = vehicles.find(item => item.id === id);
            if (v) {
                v.arrived = !v.arrived;
                if (v.arrived) {
                    const now = new Date();
                    v.arrivedAt = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    showToast(`Авто ${v.plate} отмечено как прибывшее`);
                } else {
                    v.arrivedAt = null;
                    showToast(`Авто ${v.plate} возвращено в ожидающие`);
                }
                saveToStorage();
                render();
            }
        }

        // Custom Modal helper
        let modalCallback = null;
        function showModal(title, text, callback, showCancel = false) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            modalCallback = callback;
            
            const cancelBtn = document.getElementById('modalCancelBtn');
            cancelBtn.classList.toggle('hidden', !showCancel);
            
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
            modalCallback = null;
        }

        // Simple toast notification popup
        function showToast(message) {
            const existingToast = document.getElementById('toastNotification');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toastNotification';
            toast.className = 'fixed bottom-6 right-6 z-50 bg-slate-800 border border-slate-700 text-slate-100 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs sm:text-sm animate-bounce';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-base"></i><span>${escapeHtml(message)}</span>`;
            
            document.body.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
